name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # The unit tests exercise pure logic; heavy runtime deps (faster-whisper,
        # claude-agent-sdk, piper, etc.) are imported lazily and not needed here.
        # aiohttp is required to import the tools package.
        run: |
          python -m pip install --upgrade pip
          pip install pytest aiohttp

      - name: Syntax check (all modules, including those not covered by tests)
        run: python -m compileall -q jarvis

      - name: Run tests
        run: python -m pytest -q
