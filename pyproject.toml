[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "1.0.0"
description = "Local voice/text AI assistant — Claude Agent SDK + Hyprland + piper TTS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "assistant", "voice", "hyprland", "claude", "tts", "stt", "fastapi"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.1.0",
    "faster-whisper>=1.0",
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2; python_version >= '3.13'",
    "edge-tts>=6.1.9",
    "uvloop>=0.17; sys_platform != 'win32'",
    "httptools>=0.6; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Wake-word detection via microphone (+ VAD auto-stop)
wakeword = [
    "openwakeword>=0.6.0",
    "sounddevice>=0.4.6",
    "webrtcvad>=2.0.10; sys_platform != 'win32'",
]
# WhatsApp Web automation
whatsapp = [
    "playwright>=1.40",
]
# All optional extras
all = [
    "jarvis-ai[wakeword,whatsapp]",
]
# Development / test tooling
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/EliseyRotar/jarvis-ai"
Repository = "https://github.com/EliseyRotar/jarvis-ai"
Issues = "https://github.com/EliseyRotar/jarvis-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
